<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern E-Commerce Store</title>
    <!-- Tailwind CSS CDN -->
     <script src="https://cdn.tailwindcss.com"></script>
     <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

  <!-- 1. Header with Search Bar -->
   <header class="bg-white shadow-sm sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <h1 class="text-2xl font-bold text-indigo-600 tracking-wide">TechStyle Store</h1>

      <!-- Real-Time Search Bar -->
       <div class="relative w-full sm:w-80">
        <input type="text" id="search-input" placeholder="Search products..." class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-600 text-sm">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400"></i>
       </div>

       <!-- Cart Icon -->
        <button id="cart-btn" class="relative p-2 text-gray-700 hover:text-indigo-600 transition cursor-pointer">
          <i class="fa-solid fa-cart-shopping text-2xl"></i>
          <span id="cart-count" class="absolute -top-1 -right-1 bg-indigo-600 text-white text-xs w-5 h-5 rounded-full flex item-center justify-center font-bold">0</span>
        </button>
    </div>
   </header>

    
   <!-- 2.Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex flex-col md:flex-row gap-8">

      <!-- Sidebar Filters -->
       <aside class="w-full md:w-1/4 bg-white p-6 rounded-lg shadow-sm h-fit">
        <h2 class="text-lg font-bold mb-4 border-b pb-2">Filters</h2>

        <!-- Category Filter -->
         <div class="mb-6">
          <h3 class="font-semibold text-sm text-gray-600 mb-2">Category</h3>
          <div class="space-y-2 flex flex-col">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="All" class="category-filter rounded text-indigo-600" checked>
              <span>All Categories</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="Men" class="category-filter rounded text-indigo-600">
              <span>Men's Fashion</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="Women" class="category-filter rounded text-indigo-600">
              <span>Women's Fashion</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" value="Tech" class="category-filter rounded text-indigo-600">
              <span>Tech Gadgets</span>
            </label>
          </div>
         </div>

         <!-- Price Range Filter -->
          <div>
            <div class="flex justify-between items-center mb-2">
              <h3 class="font-semibold text-sm text-gray-600">Max Price</h3>
              <span id="price-val" class="text-sm font-bold text-indigo-600">₹10,000</span>
            </div>
            <input type="range" id="price-range" min="1000" max="10000" step="500" value="10000" class="w-full accent-indigo-600 cursor-pointer">
          </div>

         <!-- Sort By Dropdown -->
          <div class="mt-6 border-t pt-4">
            <h3 class="font-semibold text-sm text-gray-600 mb-2">Sort By Price</h3>
            <select id="sort-select" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 cursor-pointer">
              <option value="dafault">Default Features</option>
              <option value ="low-high">Price: Low to High</option>
              <option value="high-low">Price: High to Low</option>
            </select>
          </div> 
       </aside>

       <!-- Product Grid Area -->
        <section class="w-full md:w-3/4">
          <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:gird-cols-3 gap-6">
            <!-- Products will be injected here dynamically via JS -->
          </div>
        </section>
    </main>

    <!-- Slide-Over Cart Drawer -->
     <div id="cart-drawer" class="fixed inset-0 z-50 transform translate-x-full transition-transform duration-300 ease-in-out pointer-events-none">
      <!-- Overlay Backdrop -->
       <div id="cart-overlay" class="absolute inset-0 bg-black bg-opacity-50"></div>

       <!-- Drawer Panel -->
        <div class="absolute right-0 top-0 bottom-0 w-full max-w-md bg-white shadow-2xl flex flex-col justify-between z-10 pointer-events-auto">

          <!-- Drawer Header -->
           <div class="p-4 border-b flex justify-between items-center bg-gray-50">
            <h2 class="text-lg font-bold">Your Cart</h2>
            <button id="close-cart-btn" class="text-gray-500 hover:text-red-500 text-2xl font-bold p-1">&times;</button>
           </div>

           <div id="cart-items" class="p-4 flex-1 overflow-y-auto space-y-4">

           </div>

           <!-- Drawer items Container -->
            <div class="p-4 border-t bg-gray-50 space-y-4">
              <div class="flex justify-between items-center text-lg font-bold">
                <span>Total:</span>
                <span id="cart-total" class="text-indigo-600">₹0</span>
              </div>
              <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg font-semibold transition shadow">Checkout Now</button>
            </div>
        </div>
     </div>
     <script src="app.js"></script>
</body>
</html>
